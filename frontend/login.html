<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - MediCare Hospital System</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/auth.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

    <div class="auth-wrapper">
        <div class="auth-card">
            <div class="auth-header">
                <a href="index.html" class="auth-logo">
                    <svg viewBox="0 0 24 24" width="32" height="32" fill="#0284c7">
                        <path d="M19 10.5h-5.5V5c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v5.5H5c-.83 0-1.5.67-1.5 1.5s.67 1.5 1.5 1.5h5.5V19c0 .83.67 1.5 1.5 1.5s1.5-.67 1.5-1.5v-5.5H19c.83 0 1.5-.67 1.5-1.5s-.67-1.5-1.5-1.5z"/>
                    </svg>
                    <span>MediCare</span>
                </a>
                <h1 class="auth-title">Welcome Back</h1>
                <p class="auth-subtitle">Sign in to your patient, doctor, or administrator portal</p>
            </div>

            <form id="login-form">
                <div class="form-group">
                    <label class="form-label" for="login-email">Email Address</label>
                    <input type="email" id="login-email" class="form-control" placeholder="name@example.com" required autocomplete="email">
                </div>

                <div class="form-group">
                    <label class="form-label" for="login-password">Password</label>
                    <input type="password" id="login-password" class="form-control" placeholder="••••••••" required autocomplete="current-password">
                </div>

                <button type="submit" id="login-btn" class="btn btn-primary" style="width:100%;margin-top:8px;">
                    Sign In
                </button>
            </form>

            <!-- Quick Demo Credential Filler -->
            <div class="demo-box">
                <div class="demo-title">⚡ Quick Demo Logins (Click to Autofill)</div>
                <div class="demo-chips">
                    <button type="button" class="demo-chip" onclick="fillCredentials('admin@hospital.com', 'admin123')">
                        👑 Admin
                    </button>
                    <button type="button" class="demo-chip" onclick="fillCredentials('sarah.mitchell@hospital.com', 'doctor123')">
                        🩺 Doctor (Cardiology)
                    </button>
                    <button type="button" class="demo-chip" onclick="fillCredentials('john.doe@patient.com', 'patient123')">
                        🧑 Patient
                    </button>
                </div>
            </div>

            <div class="auth-footer">
                Don't have an account? <a href="register.html" style="font-weight:600;">Register as Patient</a>
            </div>
            <div style="text-align:center;margin-top:16px;">
                <a href="index.html" style="font-size:0.88rem;color:#64748b;">← Back to Homepage</a>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script>
        function fillCredentials(email, password) {
            document.getElementById('login-email').value = email;
            document.getElementById('login-password').value = password;
        }

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('login-email').value.trim();
            const password = document.getElementById('login-password').value;
            const btn = document.getElementById('login-btn');

            btn.disabled = true;
            btn.textContent = 'Signing in...';

            try {
                const res = await apiRequest('/auth/login', 'POST', { email, password });
                if (res.success && res.data) {
                    showToast('Login successful! Redirecting...', 'success');
                    setCurrentUser(res.data);

                    setTimeout(() => {
                        const role = res.data.role;
                        if (role === 'PATIENT') window.location.href = 'patient-dashboard.html';
                        else if (role === 'DOCTOR') window.location.href = 'doctor-dashboard.html';
                        else if (role === 'ADMIN') window.location.href = 'admin-dashboard.html';
                        else window.location.href = 'index.html';
                    }, 800);
                }
            } catch (err) {
                showToast(err.message || 'Login failed. Please check your credentials.', 'error');
                btn.disabled = false;
                btn.textContent = 'Sign In';
            }
        });
    </script>
</body>
</html>
